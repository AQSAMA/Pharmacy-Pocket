org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ML Kit barcode-scanning 17.3.0 is not compatible with AGP 9's stricter
# keep-rule semantics. Without this compatibility switch, minified preview/release
# builds can crash while BarcodeScanning.getClient() initializes; debug is unaffected.
# Remove this once ML Kit ships AGP 9-compatible consumer keep rules.
android.r8.strictFullModeForKeepRules=false
