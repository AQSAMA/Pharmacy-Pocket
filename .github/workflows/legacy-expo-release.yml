name: Legacy Expo Android Prerelease

on:
  push:
    branches: [main]
    paths:
      - "legacy-expo/**"
      - ".github/workflows/legacy-expo-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-expo-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: legacy-expo

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: legacy-expo/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform android --clean --no-install

      - name: Set monotonic Android version code
        id: version
        run: |
          commit_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          version_code=$((commit_epoch / 60))
          perl -0pi -e "s/versionCode\s+\d+/versionCode $version_code/" android/app/build.gradle
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=legacy-preview-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build ARM64 APK
        working-directory: legacy-expo/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - name: Name and verify APK
        id: verify
        run: |
          APK="pharmacy-pocket-legacy-${{ steps.version.outputs.version_code }}-arm64.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools_dir/apksigner" verify --verbose --print-certs "$APK"
          "$build_tools_dir/zipalign" -c -P 16 -v 4 "$APK"
          echo "apk=legacy-expo/$APK" >> "$GITHUB_OUTPUT"

      - name: Publish legacy prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Pharmacy Pocket Legacy ${{ steps.version.outputs.version_code }}
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: ${{ steps.verify.outputs.apk }}
