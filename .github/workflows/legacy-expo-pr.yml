name: Legacy Expo Android PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "legacy-expo/**"
      - ".github/workflows/legacy-expo-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-expo-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  android:
    name: Test and build legacy Expo APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: legacy-expo

    steps:
      - name: Check out PR
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: legacy-expo/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Regression tests
        run: npm test

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Set monotonic Android version code
        id: version
        run: |
          commit_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          version_code=$((commit_epoch / 60))
          perl -0pi -e "s/versionCode\s+\d+/versionCode $version_code/" android/app/build.gradle
          grep -q "versionCode $version_code" android/app/build.gradle
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build ARM64 APK
        working-directory: legacy-expo/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "pharmacy-pocket-legacy-pr-${{ github.event.pull_request.number || github.run_number }}-arm64.apk"

      - name: Verify installable APK
        id: verify
        env:
          APK_NAME: pharmacy-pocket-legacy-pr-${{ github.event.pull_request.number || github.run_number }}-arm64.apk
        run: |
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools_dir/apksigner" verify --verbose --print-certs "$APK_NAME"
          "$build_tools_dir/zipalign" -c -P 16 -v 4 "$APK_NAME"
          echo "sha256=$(sha256sum "$APK_NAME" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload legacy APK
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-pocket-legacy-pr-${{ github.event.pull_request.number || github.run_number }}
          path: legacy-expo/pharmacy-pocket-legacy-pr-*-arm64.apk
          if-no-files-found: error
          retention-days: 14
