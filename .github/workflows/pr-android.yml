name: Native Android PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compute Android version code
        id: version
        shell: bash
        run: |
          commit_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          version_code=$((commit_epoch / 60))
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Run tests and build APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          gradle --no-daemon test assembleDebug -PversionCode="$VERSION_CODE" --stacktrace

      - name: Verify installable APK
        id: verify
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          mkdir -p dist
          OUT="dist/pharmacy-pocket-native-pr-${{ github.event.pull_request.number || github.run_number }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-pocket-native-pr-${{ github.event.pull_request.number || github.run_number }}
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
