name: Native Android PR

on:
  pull_request:
    branches: [main]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native-android

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up current Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compute Android version code
        id: version
        run: |
          commit_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          version_code=$((commit_epoch / 60))
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Test and build side-by-side preview
        run: gradle --no-daemon testPreviewDebugUnitTest assemblePreviewDebug -PversionCode="${{ steps.version.outputs.version_code }}" --stacktrace

      - name: Verify installable preview APK
        id: verify
        run: |
          APK="app/build/outputs/apk/preview/debug/app-preview-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          mkdir -p dist
          OUT="dist/pharmacy-pocket-native-pr-${{ github.event.pull_request.number || github.run_number }}.apk"
          cp "$APK" "$OUT"
          echo "apk=native-android/$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload native preview APK
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-pocket-native-pr-${{ github.event.pull_request.number || github.run_number }}
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
