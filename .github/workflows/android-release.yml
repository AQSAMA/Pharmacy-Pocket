name: Build Android preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build smaller ARM64 APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true
      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pharmacy-pocket-preview-${{ github.run_number }}-arm64.apk
      - name: Publish unique preview release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Pharmacy Pocket Preview #${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: pharmacy-pocket-preview-${{ github.run_number }}-arm64.apk
      - name: Add release link
        run: |
          echo "### Android preview published" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download Pharmacy Pocket Preview #${{ github.run_number }}](${{ steps.release.outputs.url }})" >> "$GITHUB_STEP_SUMMARY"
