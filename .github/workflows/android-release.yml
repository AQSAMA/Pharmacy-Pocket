name: Build Android preview

on:
  push:
    branches: [main, release/2.5]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build smaller ARM64 APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true
      - name: Release metadata
        id: metadata
        env:
          BUILD_REF: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$BUILD_REF" = "release/2.5" ]; then
            tag="v2.5"
          else
            tag="preview-$BUILD_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=pharmacy-pocket-$tag-arm64.apk" >> "$GITHUB_OUTPUT"
      - name: Name APK
        env:
          APK_NAME: ${{ steps.metadata.outputs.apk }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.tag }}-arm64
          path: ${{ steps.metadata.outputs.apk }}
          if-no-files-found: error
      - name: Publish prerelease
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Pharmacy Pocket ${{ steps.metadata.outputs.tag }} (prerelease)"
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: ${{ steps.metadata.outputs.apk }}
      - name: Add release link
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          echo "### Android prerelease published" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the standalone APK]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
