name: Native Android Prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compute Android version code
        id: version
        shell: bash
        run: |
          commit_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          version_code=$((commit_epoch / 60))
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=native-${version_code}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Run tests and build APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          gradle --no-daemon test assembleRelease -PversionCode="$VERSION_CODE" --stacktrace

      - name: Verify installable APK
        id: verify
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          mkdir -p dist
          OUT="dist/Pharmacy-Pocket-native-${{ steps.version.outputs.version_code }}.apk"
          cp "$APK" "$OUT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pharmacy-pocket-native-${{ steps.version.outputs.version_code }}
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Pharmacy Pocket Native ${{ steps.version.outputs.version_code }}
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: ${{ steps.verify.outputs.apk }}

      - name: Add release summary
        env:
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          echo "### Native Android prerelease published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android versionCode: $VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
