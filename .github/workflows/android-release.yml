name: Build Android preview

on:
  push:
    branches: [main, release/2.5]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Protect published release source
        if: github.ref == 'refs/heads/release/2.5'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v2.5")
          published_sha=$(echo "$tags" | jq -r '.[] | select(.ref == "refs/tags/v2.5") | .object.sha')
          if [ -n "$published_sha" ] && [ "$published_sha" != "$SOURCE_SHA" ]; then
            echo "::error::v2.5 already identifies another commit. Create a new version instead of replacing its APK."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Regression tests
        run: npm test
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Set monotonic Android version code
        id: version
        run: |
          commit_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          version_code=$((commit_epoch / 60))
          perl -0pi -e "s/versionCode\s+\d+/versionCode $version_code/" android/app/build.gradle
          grep -q "versionCode $version_code" android/app/build.gradle
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
      - name: Build smaller ARM64 APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true
      - name: Release metadata
        id: metadata
        env:
          BUILD_REF: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$BUILD_REF" = "release/2.5" ]; then
            tag="v2.5"
          else
            tag="preview-$BUILD_NUMBER"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=pharmacy-pocket-$tag-arm64.apk" >> "$GITHUB_OUTPUT"
      - name: Name APK
        env:
          APK_NAME: ${{ steps.metadata.outputs.apk }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"
      - name: Verify installable APK
        id: verify
        env:
          APK_NAME: ${{ steps.metadata.outputs.apk }}
        run: |
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$build_tools_dir/apksigner"
          test -x "$build_tools_dir/zipalign"
          "$build_tools_dir/apksigner" verify --verbose --print-certs "$APK_NAME"
          "$build_tools_dir/zipalign" -c -P 16 -v 4 "$APK_NAME"
          apk_sha=$(sha256sum "$APK_NAME" | awk '{print $1}')
          echo "sha256=$apk_sha" >> "$GITHUB_OUTPUT"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.tag }}-arm64
          path: ${{ steps.metadata.outputs.apk }}
          if-no-files-found: error
      - name: Publish prerelease
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Pharmacy Pocket ${{ steps.metadata.outputs.tag }} (prerelease)"
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: ${{ steps.metadata.outputs.apk }}
      - name: Add release link
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          echo "### Android prerelease published" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the standalone APK]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Android versionCode: $VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: $APK_SHA256" >> "$GITHUB_STEP_SUMMARY"
